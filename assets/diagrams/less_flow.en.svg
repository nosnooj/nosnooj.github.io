<rect x="516" y="327" width="48" height="17" rx="8.5" fill="var(--band)" stroke="var(--border)" stroke-width="1"/>
<text x="540.0" y="335.5" font-size="8.6" font-weight="600" fill="var(--sub)" text-anchor="middle"  dominant-baseline="middle">Operational DB</text>
