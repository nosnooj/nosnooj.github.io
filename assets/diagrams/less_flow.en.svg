<text x="28" y="34" font-size="19" font-weight="700" fill="var(--navy)" text-anchor="start" >Monthly-Close Integration Flow</text>
<text x="28" y="55" font-size="11" font-weight="400" fill="var(--sub)" text-anchor="start" >Integration manager's monthly process · aggregate → validate → ERP10 send → reprocess failures</text>
