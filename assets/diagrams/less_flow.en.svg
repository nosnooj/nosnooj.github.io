<text x="540.0" y="439.5" font-size="8.6" font-weight="600" fill="var(--sub)" text-anchor="middle"  dominant-baseline="middle">Operational DB</text>
<polyline points="366.0,492 366.0,526" fill="none" stroke="var(--blue)" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="96" y="526" width="540" height="70" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1.2"/>
<rect x="96" y="526" width="3.4" height="70" rx="1.7" fill="var(--amber)"/>
<circle cx="122" cy="561.0" r="13" fill="var(--pillamber)" stroke="var(--amber)" stroke-width="1.3"/>
