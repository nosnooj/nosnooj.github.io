<text x="146" y="566" font-size="9.6" font-weight="400" fill="var(--sub)" text-anchor="start" >Store per-record success/fail logs · re-integrate only failures</text>
<text x="146" y="581" font-size="9.6" font-weight="400" fill="var(--sub)" text-anchor="start" >Export close revenue to Excel (Apache POI)</text>
<rect x="570" y="535" width="48" height="17" rx="8.5" fill="var(--band)" stroke="var(--border)" stroke-width="1"/>
<text x="594.0" y="543.5" font-size="8.6" font-weight="600" fill="var(--sub)" text-anchor="middle"  dominant-baseline="middle">Operational DB</text>
<polyline points="366.0,596 366.0,630" fill="none" stroke="var(--blue)" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="256.0" y="630" width="220" height="26" rx="13.0" fill="var(--pillblue)" stroke="var(--blue)" stroke-width="1"/>
<text x="366.0" y="643.0" font-size="11" font-weight="700" fill="var(--blue)" text-anchor="middle"  dominant-baseline="middle">Close finalized · consistency secured</text>
